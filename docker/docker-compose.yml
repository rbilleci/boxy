# Docker Compose for Boxy evaluation environment
# Includes MySQL 8.0 with pre-initialized Boxy schema
# Usage: docker-compose up -d
#        mysql -h 127.0.0.1 -u boxy -pboxy -D boxy

version: '3.8'

services:
  mysql:
    image: mysql:8.0.36-debian
    container_name: boxy-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: boxy
      MYSQL_USER: boxy
      MYSQL_PASSWORD: boxy
      # MySQL performance tuning for evaluation
      # (relax durability for faster iteration; don't use in production)
      MYSQL_INITDB_SKIP_TZINFO: "yes"
    volumes:
      # Mount Liquibase migrations for schema initialization
      - ./boxy-db/src/main/resources/db/changelog:/docker-entrypoint-initdb.d
      # Persist data between container restarts
      - boxy-data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - boxy-network

  # Optional: phpmyadmin for visual inspection of data
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: boxy-phpmyadmin
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PMA_HOST: mysql
      PMA_USER: boxy
      PMA_PASSWORD: boxy
      PMA_DB: boxy
    ports:
      - "8080:80"
    networks:
      - boxy-network

volumes:
  boxy-data:
    driver: local

networks:
  boxy-network:
    driver: bridge
