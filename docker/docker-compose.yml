# Docker Compose for Boxy evaluation environment
#
# Starts MySQL 8.0 and runs Liquibase migrations to initialize the schema.
# Usage:
#   cd docker && docker-compose up -d
#   mysql -h 127.0.0.1 -u boxy -pboxy -D boxy
#
# To also start PostgreSQL:
#   docker-compose --profile postgres up -d

services:

  # ---------------------------------------------------------------------------
  # MySQL 8.0 — primary evaluation database
  # ---------------------------------------------------------------------------
  mysql:
    image: mysql:8.0.43
    container_name: boxy-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: boxy
      MYSQL_USER: boxy
      MYSQL_PASSWORD: boxy
    command: >
      mysqld
      --log-bin-trust-function-creators=1
      --event_scheduler=ON
      --innodb_flush_log_at_trx_commit=0
      --sync_binlog=0
      --innodb_autoinc_lock_mode=2
    volumes:
      - boxy-mysql-data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - boxy-network

  # ---------------------------------------------------------------------------
  # Liquibase migration runner (MySQL)
  # ---------------------------------------------------------------------------
  liquibase-mysql:
    image: liquibase/liquibase:4.31
    container_name: boxy-liquibase-mysql
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ../boxy-db/src/main/resources/db/changelog:/liquibase/changelog
    command: >
      --changelog-file=db.changelog-master.xml
      --url=jdbc:mysql://mysql:3306/boxy
      --username=boxy
      --password=boxy
      --search-path=/liquibase/changelog
      update
    networks:
      - boxy-network

  # ---------------------------------------------------------------------------
  # PostgreSQL 16 — optional, activated with: --profile postgres
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16
    container_name: boxy-postgres
    profiles: ["postgres"]
    environment:
      POSTGRES_DB: boxy
      POSTGRES_USER: boxy
      POSTGRES_PASSWORD: boxy
    volumes:
      - boxy-pg-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U boxy -d boxy"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - boxy-network

  # ---------------------------------------------------------------------------
  # Liquibase migration runner (PostgreSQL) — activated with: --profile postgres
  # ---------------------------------------------------------------------------
  liquibase-postgres:
    image: liquibase/liquibase:4.31
    container_name: boxy-liquibase-postgres
    profiles: ["postgres"]
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../boxy-db/src/main/resources/db/changelog:/liquibase/changelog
    command: >
      --changelog-file=db.changelog-master.xml
      --url=jdbc:postgresql://postgres:5432/boxy
      --username=boxy
      --password=boxy
      --search-path=/liquibase/changelog
      update
    networks:
      - boxy-network

  # ---------------------------------------------------------------------------
  # phpMyAdmin — optional visual inspection
  # ---------------------------------------------------------------------------
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: boxy-phpmyadmin
    profiles: ["admin"]
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PMA_HOST: mysql
      PMA_USER: boxy
      PMA_PASSWORD: boxy
    ports:
      - "8080:80"
    networks:
      - boxy-network

volumes:
  boxy-mysql-data:
  boxy-pg-data:

networks:
  boxy-network:
    driver: bridge
