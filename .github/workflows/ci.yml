name: CI

on:
  push:
    branches: [ main, refactor, "codex/**", "junie/**", "cursor/**", "feat/**", "fix/**", "perf/**", "refactor/**" ]
  pull_request:
    branches: [ main, refactor ]

jobs:
  build:
    name: Build & Test (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        java: [ 25 ]

    services:
      # Docker-in-Docker is available on ubuntu-latest; Testcontainers will spin up MySQL itself.
      # No explicit mysql service needed here — Testcontainers manages the container lifecycle.
      docker:
        image: docker:24-dind
        options: --privileged

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: temurin
          cache: maven

      - name: Build (skip tests)
        run: mvn clean package -DskipTests -B

      - name: Run integration tests with coverage
        # Uses `verify` instead of `test` so JaCoCo runs coverage checks (Section 1, item 69)
        run: mvn verify -B
        env:
          # Testcontainers settings
          TESTCONTAINERS_RYUK_DISABLED: "false"
          # DB_TYPE defaults to mysql — no override needed for now

      - name: Upload JaCoCo coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report-jdk${{ matrix.java }}
          path: "**/target/site/jacoco/"
          retention-days: 14

      - name: Upload Surefire reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-jdk${{ matrix.java }}
          path: "**/target/surefire-reports/"
          retention-days: 7
