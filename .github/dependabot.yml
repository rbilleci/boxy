# Dependabot configuration for automated dependency vulnerability scanning (Section 1, item 68)
#
# Dependabot will:
# - Check Maven dependencies weekly and open PRs for version updates.
# - Check GitHub Actions dependencies weekly for outdated action versions.
#
# PRs are labeled automatically so they can be filtered in the GitHub dashboard.

version: 2

updates:
  # Maven (Java) dependencies
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "java"
    commit-message:
      prefix: "chore(deps)"
    # Group minor and patch updates to reduce PR noise
    groups:
      testcontainers:
        patterns:
          - "org.testcontainers:*"
      mysql-driver:
        patterns:
          - "com.mysql:*"
      junit:
        patterns:
          - "org.junit.jupiter:*"
      liquibase:
        patterns:
          - "org.liquibase:*"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "UTC"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(ci)"
